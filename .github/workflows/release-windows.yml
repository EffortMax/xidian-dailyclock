name: Build and publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and build dependencies
        run: python scripts/install_build_dependencies.py

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q app tests scripts run_app.py xidian_login.py courseChoose.py courseQuery.py
          python -c "import importlib.util; assert importlib.util.find_spec('cv2') is None"
          python -m unittest discover -s tests -v
          python run_app.py --self-test

      - name: Build single-file EXE
        run: python scripts/build_release.py

      - name: Run packaged OCR and DPAPI self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/XDU-Course-Assistant-v0.3.1-windows-x64.exe"
          $env:XDU_SELF_TEST_REPORT = Join-Path $PWD "release/packaged-self-test.log"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $env:XDU_SELF_TEST_REPORT) {
              Get-Content $env:XDU_SELF_TEST_REPORT
            }
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }

      - name: Run child-aware packaged GUI smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/XDU-Course-Assistant-v0.3.1-windows-x64.exe"
          $parent = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $processes = @(Get-Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ProcessName -like "XDU-Course-Assistant*"
            })
            if ($processes.Count -eq 0) {
              throw "No packaged GUI parent or child process remained alive"
            }
          }
          finally {
            Get-Process -ErrorAction SilentlyContinue | Where-Object {
              $_.ProcessName -like "XDU-Course-Assistant*"
            } | Stop-Process -Force
          }

      - name: Publish v0.3.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          target_commitish: ${{ github.sha }}
          name: XDU Course Assistant v0.3.1
          body_path: packaging/github-release-v0.3.1.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/XDU-Course-Assistant-v0.3.1-windows-x64.exe
            release/XDU-Course-Assistant-v0.3.1-windows-x64.exe.sha256
