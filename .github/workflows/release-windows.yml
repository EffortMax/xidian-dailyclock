name: Build and publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run automated tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q app tests scripts run_app.py xidian_login.py courseChoose.py courseQuery.py
          python -m unittest discover -s tests -v

      - name: Build single-file EXE
        run: python scripts/build_release.py

      - name: Run packaged OCR and DPAPI self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/XDU-Course-Assistant-v0.3.0-windows-x64.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }

      - name: Publish v0.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: XDU Course Assistant v0.3.0
          body_path: packaging/github-release-v0.3.0.md
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/XDU-Course-Assistant-v0.3.0-windows-x64.exe
            release/XDU-Course-Assistant-v0.3.0-windows-x64.exe.sha256
